<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SuyuFit — Food & Gym Tracker</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --bg2:#08080D; --card:#0E0E14; --card2:#17171F; --line:#25252F;
  --ink:#EFEBFA; --mut:#9A93AE; --dim:#645E78;
  --gold:#B49AFC; --gold-soft:rgba(180,154,252,.15);
  --pro:#58E6B4; --carb:#6E8BFF; --fat:#E07BD6;
  --ok:#4BDCA4; --warn:#F58C7E;
  --r:16px; --rs:10px;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
h1,h2,h3{font-family:var(--disp)}
.num{font-family:'JetBrains Mono',var(--disp),monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header .brand{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
header .brand span{color:var(--gold)}
.datebar{display:flex;align-items:center;gap:4px}
.datebar button{width:34px;height:34px;border-radius:50%;font-size:17px;color:var(--mut)}
.datebar button:active{background:var(--card)}
.datebar .dlabel{font-family:var(--disp);font-weight:600;font-size:14px;min-width:86px;text-align:center}
.datebar .dlabel.today{color:var(--gold)}

main{padding:0 16px;max-width:560px;margin:0 auto}
.tabpage{display:none;animation:fade .18s ease}
.tabpage.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 .act{color:var(--gold);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}

/* fuel gauge hero */
.hero{padding:20px 16px 16px}
.hero .big{font-family:var(--disp);font-weight:700;font-size:52px;line-height:1;letter-spacing:-1px}
.hero .big small{font-size:16px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:6px}
.hero .sub{color:var(--mut);font-size:13px;margin-top:4px}
.hero .sub b{color:var(--ink);font-weight:600}
.gauge{height:14px;border-radius:7px;background:var(--bg2);margin:16px 0 6px;display:flex;overflow:hidden;border:1px solid var(--line)}
.gauge i{display:block;height:100%;transition:width .4s ease}
.gauge .gp{background:var(--pro)} .gauge .gc{background:var(--carb)} .gauge .gf{background:var(--fat)}
.gauge.over{outline:2px solid var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macro{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:10px}
.macro .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.macro .lab i{width:8px;height:8px;border-radius:2px;display:inline-block}
.macro .val{font-family:var(--disp);font-weight:600;font-size:17px;margin-top:3px}
.macro .val small{color:var(--dim);font-size:12px;font-weight:400}
.mbar{height:4px;border-radius:2px;background:var(--card2);margin-top:7px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:2px}

/* micros */
.microgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.micro .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.micro .top .n{color:var(--mut)} .micro .top .v{font-family:var(--disp);font-weight:600}
.micro .mbar{margin-top:0;height:5px}
.micro.overcap .top .v{color:var(--warn)}

/* meals */
.meal{margin-bottom:14px}
.meal .mhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
.meal .mhead .mn{font-family:var(--disp);font-weight:600;font-size:15px}
.meal .mhead .mk{font-size:12.5px;color:var(--mut)}
.fitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.fitem .fi-main{flex:1;min-width:0}
.fitem .fi-n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .fi-q{font-size:12px;color:var(--mut)}
.fitem .fi-k{font-family:var(--disp);font-weight:600;font-size:15px}
.fitem .fi-k small{color:var(--dim);font-weight:400;font-size:11px}
.addbtn{width:100%;border:1px dashed var(--line);border-radius:var(--rs);padding:9px;color:var(--gold);
  font-weight:600;font-size:14px;background:transparent}
.addbtn:active{background:var(--gold-soft)}

/* bottom tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;letter-spacing:.04em;color:var(--dim);font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}

/* sheets & modals */
.sheetwrap{position:fixed;inset:0;z-index:50;display:none}
.sheetwrap.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;
  border:1px solid var(--line);border-bottom:none;max-height:88vh;display:flex;flex-direction:column;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px;flex:none}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:12px}
.sheet .scroll{overflow-y:auto;flex:1;min-height:0;margin:0 -4px;padding:0 4px}

/* search list */
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.srow .sn{flex:1;min-width:0}
.srow .sn b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn span{font-size:12px;color:var(--mut)}
.srow .sk{font-family:var(--disp);font-weight:600;color:var(--gold);font-size:14px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

/* qty stepper */
.qtyrow{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0}
.qtyrow button{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:600}
.qtyrow input{width:110px;text-align:center;font-family:var(--disp);font-size:22px;font-weight:600;padding:8px}
.qpreview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.qpreview div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 4px;text-align:center}
.qpreview .qv{font-family:var(--disp);font-weight:600;font-size:15px}
.qpreview .ql{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--gold);color:#120B26;font-weight:700;
  font-size:15px;border-radius:12px;padding:13px;font-family:var(--disp)}
.btn:active{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btnrow{display:flex;gap:10px;margin-top:10px}
.btnrow .btn{flex:1}

/* forms */
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow>div{flex:1}
label.fl{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px;letter-spacing:.03em}

/* gym */
.wpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.wpick::-webkit-scrollbar{display:none}
.wpick .chip{white-space:nowrap;flex:none}
.excard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exhead .xn{font-family:var(--disp);font-weight:600;font-size:16px}
.exhead .xt{font-size:12px;color:var(--mut)}
.coach{margin:10px 0 4px;background:var(--gold-soft);border:1px solid rgba(180,154,252,.42);color:var(--gold);
  border-radius:var(--rs);padding:8px 11px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:flex-start}
.coach.hold{background:rgba(95,180,245,.1);border-color:rgba(95,180,245,.35);color:var(--carb)}
.coach.down{background:rgba(245,140,126,.1);border-color:rgba(245,140,126,.35);color:var(--fat)}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.setrow .sN{color:var(--dim);font-family:var(--disp);font-weight:600;text-align:center}
.setrow input{text-align:center;padding:9px 6px;font-family:var(--disp);font-weight:600}
.setrow input::placeholder{color:var(--dim);font-weight:400}
.setrow .del{color:var(--dim);font-size:17px;text-align:center}
.setrow.done input{border-color:rgba(75,220,164,.5)}
.sethead{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;font-size:10.5px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-top:10px}
.addset{margin-top:10px;font-size:13px;color:var(--gold);font-weight:600}

/* planner */
.week{display:flex;flex-direction:column;gap:8px}
.wday{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.wday .dn{font-family:var(--disp);font-weight:600;width:42px}
.wday select{flex:1}
.wday .dot{width:10px;height:10px;border-radius:50%;background:var(--card2);flex:none}
.wday .dot.did{background:var(--ok)}
.wday.today2{border-color:var(--gold)}
.histrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.histrow .hd{color:var(--mut)}

/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .sv{font-family:var(--disp);font-weight:700;font-size:24px}
.stat .sl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
svg.spark{width:100%;height:70px;display:block}

.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:14px 0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:9px 18px;font-size:13.5px;
  font-weight:500;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* rest timer */
.restbtn{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--gold);font-family:var(--disp)}
.restbtn:active{background:var(--gold-soft)}
#restpill{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:45;display:flex;align-items:center;gap:10px;background:var(--gold);color:#120B26;
  border-radius:26px;padding:9px 16px;font-weight:600;font-size:13.5px;border:none;
  box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:88vw}
#restpill b{font-family:var(--disp);font-size:17px}
#restpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
#restpill i{font-style:normal;opacity:.65}
#restpill.go{background:var(--ok)}
/* habits */
.habit{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 2px;font-size:14px;color:var(--mut)}
.habit i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal;font-weight:700}
.habit.on{color:var(--ink)}
.habit.on i{background:var(--gold);border-color:var(--gold);color:#120B26}

/* system flavor */
.lv{font-style:normal;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.08em;
  color:var(--gold);border:1px solid rgba(180,154,252,.45);border-radius:6px;padding:2px 7px;
  margin-left:8px;vertical-align:2px;box-shadow:0 0 10px rgba(180,154,252,.25),inset 0 0 8px rgba(180,154,252,.08)}
.syspanel{border:1px solid rgba(180,154,252,.5);border-radius:12px;padding:14px 16px;margin-bottom:12px;
  background:linear-gradient(180deg,rgba(180,154,252,.07),rgba(180,154,252,.02));
  box-shadow:0 0 24px rgba(180,154,252,.12),inset 0 0 24px rgba(180,154,252,.04)}
.systag{text-align:center;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.28em;
  color:var(--gold);margin-bottom:12px;text-shadow:0 0 12px rgba(180,154,252,.6)}
.sysrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:14px;color:var(--mut)}
.sysrow b{color:var(--ink);font-size:16px}
.xpbar{height:7px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7A63C9,var(--gold));border-radius:4px;
  box-shadow:0 0 8px rgba(180,154,252,.7)}
/* session mode */
.sesshead{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.sessexit{color:var(--dim);font-size:13px;font-weight:600;flex:none}
.sessprog{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--gold)}
.sesscard{border-color:rgba(180,154,252,.35);box-shadow:0 0 20px rgba(180,154,252,.08)}
.bodysvg{width:100%;max-width:330px;height:auto;display:block;margin:2px auto 6px}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mchips .mc{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:5px;padding:3px 8px;
  background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.mchips .mcp{background:var(--gold-soft);color:var(--gold);border-color:rgba(180,154,252,.4)}

.habit{position:relative}
.habit .xpv{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--dim);font-family:var(--disp);flex:none}
.habit.on .xpv{color:var(--gold)}
.habit.auto{cursor:default}

/* ambient grid + vignette */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%,rgba(122,92,224,.10),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(180,154,252,.045) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(180,154,252,.045) 39px 40px)}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
/* HUD corner brackets */
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(180,154,252,.75);pointer-events:none}
.hud::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-top-left-radius:6px}
.hud::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-bottom-right-radius:6px}
/* bar fill animation */
@keyframes growx{from{transform:scaleX(0)}}
.gauge i,.mbar i,.xpbar i{transform-origin:left;animation:growx .55s cubic-bezier(.2,.8,.2,1)}
/* scan-line over the hologram */
.scanwrap{position:relative;overflow:hidden;border-radius:10px}
.scanwrap::after{content:"";position:absolute;left:0;right:0;top:-22%;height:16%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(180,154,252,.17),transparent);animation:scan 2.8s linear infinite}
@keyframes scan{to{top:122%}}
/* set-complete flash */
@keyframes okpulse{0%{box-shadow:0 0 0 0 rgba(88,230,180,.55)}100%{box-shadow:0 0 0 14px rgba(88,230,180,0)}}
.flashok{animation:okpulse .6s ease-out}
/* full-screen announcement */
#announce{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .25s}
#announce.on{opacity:1;pointer-events:auto}
.annbox{border:1px solid rgba(180,154,252,.65);border-radius:14px;padding:22px 30px;text-align:center;max-width:82vw;
  background:linear-gradient(180deg,rgba(180,154,252,.10),rgba(0,0,0,.6));
  box-shadow:0 0 40px rgba(180,154,252,.35),inset 0 0 30px rgba(180,154,252,.06)}
.annt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.3em;color:var(--gold);
  text-shadow:0 0 14px rgba(180,154,252,.8);margin-bottom:8px}
.anns{font-family:var(--disp);font-weight:700;font-size:20px}
/* water quest buttons + meal options */
.wbtn{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;line-height:1}
.mopt{color:var(--dim);font-size:18px;padding:0 6px;line-height:1}
/* charts */
.chartcard svg{width:100%;height:auto;display:block}
.exlink{color:var(--gold);opacity:.7;font-size:11px;vertical-align:2px}
/* photo grid */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pgrid .padd{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:26px}
.pcompare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcompare img{width:100%;border-radius:8px;border:1px solid var(--line)}
/* achievements */
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg2)}
.ach b{display:block;font-size:12.5px;font-family:var(--disp)}
.ach span{font-size:11px;color:var(--dim)}
.ach.got{border-color:rgba(180,154,252,.55);box-shadow:0 0 10px rgba(180,154,252,.12)}
.ach.got b{color:var(--gold)}
</style>
</head>

/* ================= UTILS ================= */
function uid(){return Math.random().toString(36).slice(2,9);}
function pad(x){return String(x).padStart(2,"0");}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
let viewDate=new Date();
function todayKey(){return keyOf(new Date());}
function isToday(){return keyOf(viewDate)===todayKey();}
function fmtDate(d){
  if(keyOf(d)===todayKey())return "Today";
  const y=new Date();y.setDate(y.getDate()-1);
  if(keyOf(d)===keyOf(y))return "Yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function r0(x){return Math.round(x);} function r1(x){return Math.round(x*10)/10;}
function el(id){return document.getElementById(id);}
let annT=null;
function announce(title,sub){
  let a=el("announce");
  if(!a){a=document.createElement("div");a.id="announce";document.body.appendChild(a);a.onclick=()=>a.classList.remove("on");}
  a.innerHTML=`<div class="annbox"><div class="annt">${esc(title)}</div><div class="anns">${esc(sub)}</div></div>`;
  a.classList.add("on");clearTimeout(annT);annT=setTimeout(()=>a.classList.remove("on"),2400);
  if(navigator.vibrate)navigator.vibrate(80);
}
function countUp(elm,val,dur){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){elm.textContent=r0(val);return;}
  const start=performance.now();
  const step=t=>{const p=Math.min(1,(t-start)/(dur||550));
    elm.textContent=r0(val*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
let toastT;
function toast(msg){const t=el("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1900);}

/* ================= TARGETS (Mifflin-St Jeor + recomp logic) ================= */
function calcTargets(){
  const p=S.profile;
  const bmr=p.sex==="m"?(10*p.w+6.25*p.h-5*p.age+5):(10*p.w+6.25*p.h-5*p.age-161);
  const tdee=bmr*p.act;
  let kcal;
  if(p.goal==="cut")kcal=tdee*0.8;
  else if(p.goal==="bulk")kcal=tdee*1.1;
  else if(p.goal==="recomp")kcal=tdee*0.92; // small deficit, high protein
  else kcal=tdee;
  const protein=p.goal==="maintain"?1.6*p.w:2*p.w;
  const fat=0.8*p.w;
  const carbs=Math.max(50,(kcal-protein*4-fat*9)/4);
  return {kcal:r0(kcal),p:r0(protein),c:r0(carbs),f:r0(fat),bmr:r0(bmr),tdee:r0(tdee)};
}
function targets(){
  const auto=calcTargets();
  if(S.targets)return Object.assign({},auto,S.targets);
  return auto;
}

const MEALS=["Breakfast","Lunch","Snacks","Dinner"];
const HABITS=[["walk","Morning walk — 2,000+ steps (6–7 AM)"],["protein","Protein after training"],["creatine","Creatine 3–5 g"],["sleep","Slept 7.5–8 h last night"]];
function dayLog(){const k=keyOf(viewDate);if(!S.foodLog[k])S.foodLog[k]=[];return S.foodLog[k];}
function dayTotals(items){
  const t={k:0,p:0,c:0,f:0};MICROS.forEach(m=>t[m.key]=0);
  items.forEach(it=>{const x=it.g/100;
    t.k+=it.per.k*x;t.p+=it.per.p*x;t.c+=it.per.c*x;t.f+=it.per.f*x;
    MICROS.forEach(m=>t[m.key]+=(it.per[m.key]||0)*x);});
  return t;
}

function renderToday(){
  const items=dayLog(), T=targets(), tot=dayTotals(items);
  const rem=T.kcal-tot.k;
  const pct=v=>Math.min(100,Math.max(0,v));
  const kp=pct(tot.p*4/T.kcal*100),kc=pct(tot.c*4/T.kcal*100),kf=pct(tot.f*9/T.kcal*100);
  const over=tot.k>T.kcal;

  let html=`
  <div class="card hero hud">
    <div class="big num" style="${over?'color:var(--warn)':''}"><span id="heroNum">${r0(Math.abs(rem))}</span><small>kcal ${over?"over":"left"}</small></div>
    <div class="sub"><b>${r0(tot.k)}</b> eaten of <b>${T.kcal}</b> target${S.goal&&S.goal.tw?` · <button id="goalChip" class="act" style="font-size:12px;letter-spacing:.05em">GOAL ${S.goal.tw} KG</button>`:""}</div>
    <div class="gauge ${over?'over':''}" role="img" aria-label="calorie fuel gauge">
      <i class="gp" style="width:${kp}%"></i><i class="gc" style="width:${kc}%"></i><i class="gf" style="width:${kf}%"></i>
    </div>
    <div class="macros">
      ${macroBox("Protein",tot.p,T.p,"var(--pro)")}
      ${macroBox("Carbs",tot.c,T.c,"var(--carb)")}
      ${macroBox("Fat",tot.f,T.f,"var(--fat)")}
    </div>
  </div>

  <div class="card">
    <h3>Micros <button class="act" id="microToggle">${S._microOpen?"Hide":"Show"}</button></h3>
    <div class="microgrid" id="microGrid" style="${S._microOpen?"":"display:none"}">
      ${MICROS.map(m=>{
        const v=tot[m.key],p2=pct(v/m.goal*100),overCap=m.cap&&v>m.goal;
        const col=m.cap?(overCap?"var(--warn)":"var(--mut)"):(p2>=100?"var(--ok)":"var(--gold)");
        return `<div class="micro ${overCap?'overcap':''}">
          <div class="top"><span class="n">${m.n}</span><span class="v num">${m.unit==="g"?r1(v):r0(v)}<span style="color:var(--dim)">/${m.goal}${m.unit}</span></span></div>
          <div class="mbar"><i style="width:${p2}%;background:${col}"></i></div></div>`;
      }).join("")}
    </div>
  </div>`;

  const hb=S.habits[keyOf(viewDate)]||{};
  const wDone=!!(S.workLog[keyOf(viewDate)]&&S.workLog[keyOf(viewDate)].done);
  const autoQ=[
    ["Log your food",items.length>0,10],
    [`Hit protein — ${T.p} g`,tot.p>=T.p,15],
    [`Land within ±10% of ${T.kcal} kcal`,items.length>0&&tot.k>=T.kcal*0.9&&tot.k<=T.kcal*1.1,15],
    ["Complete today's workout",wDone,25]
  ];
  html+=`<div class="card"><h3>Daily quests</h3>
    ${autoQ.map(q=>`<div class="habit auto ${q[1]?"on":""}"><i>${q[1]?"✓":""}</i><span>${q[0]}</span><b class="xpv num">+${q[2]}</b></div>`).join("")}
    <div style="border-top:1px solid var(--line);margin:6px 0"></div>
    ${HABITS.map(h=>`<button class="habit ${hb[h[0]]?"on":""}" data-habit="${h[0]}"><i>${hb[h[0]]?"✓":""}</i><span>${h[1]}</span><b class="xpv num">+5</b></button>`).join("")}
    <div class="habit auto ${(hb.water||0)>=8?"on":""}"><i>${(hb.water||0)>=8?"✓":""}</i><span>Water — ${hb.water||0} / 8 glasses</span>
      <span style="margin-left:auto;display:flex;gap:7px;align-items:center">
      <button class="wbtn" data-water="-1">−</button><button class="wbtn" data-water="1">+</button></span>
      <b class="xpv num">+5</b></div>
  </div>`;

  MEALS.forEach(meal=>{
    const mi=items.filter(i=>i.meal===meal);
    const mk=r0(mi.reduce((a,i)=>a+i.per.k*i.g/100,0));
    html+=`<div class="meal"><div class="mhead"><span class="mn">${meal}</span><span style="display:flex;align-items:center;gap:8px"><span class="mk num">${mk?mk+" kcal":""}</span><button class="mopt" data-mopt="${meal}" aria-label="${meal} options">⋯</button></span></div>`;
    mi.forEach(i=>{
      html+=`<button class="fitem" data-edit="${i.id}">

        <div class="fi-k num">${r0(i.per.k*i.g/100)}<small> kcal</small></div></button>`;

  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditItem(b.dataset.edit));
}
function macroBox(n,v,goal,col){
  const p=Math.min(100,v/goal*100);

}

/* ================= PACKAGED FOOD SCANNER (no AI: barcode → OpenFoodFacts, else on-device OCR) ================= */
function resizeToDataURL(file,max){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",0.85));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}
async function offLookup(code){
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json");
  if(!r.ok)return null;
  const j=await r.json();
  if(j.status!==1||!j.product)return null;
  const P=j.product,N=P.nutriments||{};
  const d={name:P.product_name||P.generic_name||"Scanned product",
    per100:{k:Math.round(+N["energy-kcal_100g"]||0),p:+N.proteins_100g||0,c:+N.carbohydrates_100g||0,f:+N.fat_100g||0,
      fi:+N.fiber_100g||0,su:+N.sugars_100g||0,
      na:N.sodium_100g?Math.round(N.sodium_100g*1000):0,
      kk:N.potassium_100g?Math.round(N.potassium_100g*1000):0,
      ca:N.calcium_100g?Math.round(N.calcium_100g*1000):0,
      fe:N.iron_100g?Math.round(N.iron_100g*10000)/10:0,
      vc:N["vitamin-c_100g"]?Math.round(N["vitamin-c_100g"]*1000):0},
    serving:{label:P.serving_size||"1 serving",grams:+P.serving_quantity||100}};
  return d.per100.k?d:null;
}
async function openBarcodeScanner(meal){
  const canLive=("BarcodeDetector" in window)&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  openSheet(`<h2>Scan the barcode</h2>
    <div id="bcWrap" style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000">
      <video id="bcVid" playsinline muted style="width:100%;max-height:44vh;display:block;object-fit:cover"></video>
      <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(180,154,252,.5);border-radius:12px"></div>
    </div>
    <div class="note" style="text-align:center;margin:10px 0" id="bcMsg">${canLive?"Hold the barcode steady in view — wrinkles are fine, it reads continuously.":"Live scanning isn't supported on this browser."}</div>
    <div class="btnrow">
      <button class="btn ghost" id="bcOcr">Read label photo instead</button>
      <button class="btn ghost" id="bcManual">Type it in</button>
    </div>
    <input type="file" id="bcFile" accept="image/*" capture="environment" style="display:none">`);
  el("bcManual").onclick=()=>openCustomFood(meal,null);
  el("bcOcr").onclick=()=>el("bcFile").click();
  el("bcFile").onchange=e=>{const f=e.target.files[0];if(f)ocrFlow(f,meal);};
  if(!canLive)return;
  let stream=null,stop=false;
  window._stopScan=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}}});
    const vid=el("bcVid");if(!vid){window._stopScan();return;}
    vid.srcObject=stream;await vid.play();
    const det=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
    const seen={};
    const loop=async()=>{
      if(stop||!el("bcVid"))return;
      try{
        const found=await det.detect(vid);
        if(found.length){
          const code=found[0].rawValue;
          seen[code]=(seen[code]||0)+1;
          if(seen[code]>=2){ // require 2 consistent reads
            window._stopScan();
            el("bcMsg").textContent="Barcode "+code+" ✓ — checking product database…";
            if(navigator.vibrate)navigator.vibrate(60);
            const d=await offLookup(code).catch(()=>null);
            if(d){openLabelConfirm(d,meal);}
            else{
              toast("Not in the product database — type the label in");
              openCustomFood(meal,null);
            }
            return;
          }
        }
      }catch(_){}
      setTimeout(loop,240);
    };
    loop();
  }catch(e){
    el("bcMsg").textContent="Camera permission needed for live scanning — or use the buttons below.";
  }
}
async function ocrFlow(file,meal){
  openSheet(`<h2>Reading label…</h2><div class="empty" id="scanMsg">Sending to AI — takes ~5 seconds…</div>`);
  try{
    const dataUrl=await resizeToDataURL(file,1400);
    const r=await fetch(BACKEND_URL+"/api/scan",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({imageBase64:dataUrl})
    });
    const j=await r.json();
    if(!j.ok||!j.data)throw new Error(j.error||"no data");
    openLabelConfirm(j.data,meal);
  }catch(e){
    closeSheet();
    toast("AI couldn't read it — type it in manually");
    setTimeout(()=>openCustomFood(meal,null),600);
  }
}

let gymDayId=null; // currently viewed workout day
function weekdayName(d){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];}
function scheduledFor(d){return S.schedule[weekdayName(d)]||null;}
function workLog(){const k=keyOf(viewDate);return S.workLog[k]||null;}

function lastNSessions(exName,beforeKey,n){
  const keys=Object.keys(S.workLog).filter(k=>k<beforeKey).sort().reverse();
  const out=[];
  for(const k of keys){
    const w=S.workLog[k];
    if(w&&w.entries&&w.entries[exName]){
      const sets=w.entries[exName].filter(t=>t.w!=null&&t.r!=null);
      if(sets.length){out.push({date:k,sets});if(out.length>=n)break;}
    }
  }
  return out;
}
function lastSession(exName,beforeKey){
  // find most recent logged session containing this exercise before given date
  const keys=Object.keys(S.workLog).filter(k=>k<beforeKey).sort().reverse();
  for(const k of keys){
    const w=S.workLog[k];
    if(w&&w.entries&&w.entries[exName]&&w.entries[exName].some(s=>s.w!=null||s.r!=null))
      return {date:k,sets:w.entries[exName].filter(s=>s.w!=null&&s.r!=null)};
  }
  return null;
}

function coachSuggest(ex){
  const last=lastSession(ex.n,keyOf(viewDate));
  const iso=ex.ty==="i";
  if(!last||!last.sets.length)
    return {cls:"",icon:"◎",msg:`First time — pick a weight you can do ${ex.lo}–${ex.hi} reps with, leaving ~2 in the tank.`};
  const sets=last.sets;
  const topW=Math.max(...sets.map(t=>+t.w||0));
  const topSets=sets.filter(t=>(+t.w||0)===topW);
  const minR=Math.min(...topSets.map(t=>+t.r||0));
  const allTop=topSets.every(t=>(+t.r||0)>=ex.hi);
  const anyBelow=topSets.some(t=>(+t.r||0)<ex.lo);
  if(allTop){
    if(iso)return {cls:"",icon:"↑",msg:`Reps maxed at ${ex.hi} — add ${ex.inc} kg → ${r1(topW+ex.inc)} kg and rebuild from ${ex.lo} reps.`};
    return {cls:"",icon:"↑",msg:`Top of range on every set — add ${ex.inc} kg → try ${r1(topW+ex.inc)} kg.`};
  }
  if(anyBelow){
    const two=lastNSessions(ex.n,keyOf(viewDate),2);
    if(two.length===2){
      const belowAt=sess2=>{const tw=Math.max(...sess2.sets.map(t=>+t.w||0));return tw===topW&&sess2.sets.some(t=>(+t.w||0)===tw&&(+t.r||0)<ex.lo);};
      if(belowAt(two[0])&&belowAt(two[1]))
        return {cls:"down",icon:"⟳",msg:`Stalled 2 sessions at ${topW} kg — deload to ~${r1(topW*0.9)} kg and build back up over 2 weeks.`};
    }
    return {cls:"down",icon:"↓",msg:`Stay at ${topW} kg or drop ~5%. Some sets fell under ${ex.lo} reps last time.`};
  }
  if(iso)return {cls:"hold",icon:"→",msg:`Keep ${topW} kg — reps first: push each set toward ${ex.hi} (last low set: ${minR}).`};
  return {cls:"hold",icon:"→",msg:`Keep ${topW} kg — beat last time's ${minR} reps by +1 on each set.`};
}

function renderGym(){
  if(sess){renderSession();return;}
  const todaySched=scheduledFor(viewDate);
  const log=workLog();
  if(!gymDayId)gymDayId=(log&&log.dayId)||todaySched||S.plan[0].id;
  const day=S.plan.find(d=>d.id===gymDayId)||S.plan[0];
  gymDayId=day.id;

  let html=`<div class="wpick">`+S.plan.map(d=>
    `<button class="chip ${d.id===day.id?"on":""}" data-day="${d.id}">${esc(d.n.split("—")[0].trim())}</button>`).join("")+
    `<button class="chip" data-day="__edit">✎ Edit plan</button></div>`;

  if(todaySched&&todaySched!==day.id&&isToday()){
    const sn=S.plan.find(d=>d.id===todaySched);
    if(sn)html+=`<div class="note" style="margin:-4px 2px 10px">Scheduled today: <b style="color:var(--gold)">${esc(sn.n)}</b></div>`;
  }
  const done=log&&log.done;
  html+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px">
    <h2 style="font-size:18px">${esc(day.n)}</h2>
    ${done?`<span style="color:var(--ok);font-size:13px;font-weight:600">✓ Logged</span>`:""}
  </div>`;
  html+=`<button class="btn" id="startSess" style="margin-bottom:14px">▶ Start workout</button>`;

  const entries=(log&&log.dayId===day.id&&log.entries)||{};
  day.ex.forEach(ex=>{
    const sug=coachSuggest(ex);
    const sets=entries[ex.n]||Array.from({length:ex.sets},()=>({w:null,r:null}));
    const last=lastSession(ex.n,keyOf(viewDate));
    html+=`<div class="excard" data-ex="${esc(ex.n)}">
      <div class="exhead"><div><button class="xn" data-chart="${esc(ex.n)}" style="text-align:left;padding:0">${esc(ex.n)} <span class="exlink">↗</span></button>
      <div class="xt">${ex.sets} × ${ex.lo}–${ex.hi} reps · rest ${ex.ty==="c"?"2–3 min":"60–90 s"}</div></div>
      <button class="restbtn" data-rest="${ex.rest||90}" data-rlabel="${esc(ex.n)}">⏱ ${fmtSec(ex.rest||90)}</button></div>
      <div class="coach ${sug.cls}"><span>${sug.icon}</span><span>${sug.msg}</span></div>
      ${mchipsHTML(ex.n)}
      <div class="sethead"><span>Set</span><span>kg</span><span>reps</span><span></span></div>
      ${sets.map((s,i)=>{
        const ghost=last&&last.sets[i]?last.sets[i]:null;
        return `<div class="setrow ${s.w!=null&&s.r!=null?"done":""}" data-set="${i}">
          <span class="sN">${i+1}</span>
          <input type="number" inputmode="decimal" class="inW" value="${s.w!=null?s.w:""}" placeholder="${ghost?ghost.w:"–"}">
          <input type="number" inputmode="numeric" class="inR" value="${s.r!=null?s.r:""}" placeholder="${ghost?ghost.r:"–"}">
          <button class="del" data-delset="${i}" aria-label="remove set">×</button>
        </div>`;}).join("")}
      <button class="addset" data-addset>+ Add set</button>
    </div>`;
  });
  html+=`<button class="btn" id="finishW" style="margin:4px 0 20px">${done?"Update workout":"Finish & save workout"}</button>`;
  el("page-gym").innerHTML=html;

  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    if(b.dataset.day==="__edit"){openPlanEditor();return;}
    gymDayId=b.dataset.day;renderGym();
  });
  el("startSess").onclick=startSession;
  document.querySelectorAll("[data-chart]").forEach(b=>b.onclick=()=>openExChart(b.dataset.chart));
  // set inputs autosave into a draft on the log
  document.querySelectorAll(".excard").forEach(card=>{
    const exName=card.dataset.ex;
    const exObj=day.ex.find(x=>x.n===exName)||{rest:90};
    const rb=card.querySelector(".restbtn");
    if(rb)rb.onclick=()=>startRest(+rb.dataset.rest,rb.dataset.rlabel);
    card.querySelectorAll(".setrow").forEach(row=>{
      const i=+row.dataset.set;
      const wIn=row.querySelector(".inW"),rIn=row.querySelector(".inR");
      const commit=()=>{
        const k=keyOf(viewDate);
        if(!S.workLog[k])S.workLog[k]={dayId:day.id,entries:{},done:false};
        S.workLog[k].dayId=day.id;
        const e=S.workLog[k].entries;
        if(!e[exName])e[exName]=[];
        while(e[exName].length<=i)e[exName].push({w:null,r:null});
        const wasDone=e[exName][i]&&e[exName][i].w!=null&&e[exName][i].r!=null;
        e[exName][i]={w:wIn.value===""?null:+wIn.value,r:rIn.value===""?null:+rIn.value};
        save();
        const nowDone=e[exName][i].w!=null&&e[exName][i].r!=null;
        row.classList.toggle("done",nowDone);
        if(nowDone&&!wasDone){startRest(exObj.rest||90,exName);checkPR(exName,e[exName][i].w,e[exName][i].r);}
      };
      wIn.onchange=commit;rIn.onchange=commit;
      row.querySelector("[data-delset]").onclick=()=>{
        const k=keyOf(viewDate);
        if(S.workLog[k]&&S.workLog[k].entries[exName])S.workLog[k].entries[exName].splice(i,1);
        save();renderGym();
      };
    });
    card.querySelector("[data-addset]").onclick=()=>{
      const k=keyOf(viewDate);
      if(!S.workLog[k])S.workLog[k]={dayId:day.id,entries:{},done:false};
      const e=S.workLog[k].entries;
      if(!e[exName])e[exName]=Array.from({length:day.ex.find(x=>x.n===exName).sets},()=>({w:null,r:null}));
      e[exName].push({w:null,r:null});
      save();renderGym();
    };
  });
  el("finishW").onclick=()=>{
    const k=keyOf(viewDate);
    if(!S.workLog[k]||!Object.keys(S.workLog[k].entries||{}).length){toast("Log at least one set first");return;}
    S.workLog[k].done=true;S.workLog[k].dayId=day.id;
    save();renderGym();renderPlan();updateLv();openSummary(k);
  };
}

/* ================= MUSCLE MAP / XP SYSTEM ================= */
const MUSCLES={chest:"Chest",fdelt:"Front Delts",sdelt:"Side Delts",rdelt:"Rear Delts",trap:"Traps",lat:"Lats",bicep:"Biceps",tricep:"Triceps",fore:"Forearms",abs:"Abs / Core",lowback:"Lower Back",glute:"Glutes",quad:"Quads",ham:"Hamstrings",calf:"Calves"};
const MRULES=[
 [/leg extension/,["quad"],[]],
 [/leg curl/,["ham"],[]],
 [/leg press|squat|lunge/,["quad"],["glute","ham"]],
 [/calf/,["calf"],[]],
 [/hyperextension|back extension|deadlift|good morning/,["lowback"],["glute","ham"]],
 [/crunch|leg raise|plank|sit-?up|ab wheel|abs/,["abs"],[]],
 [/lateral raise/,["sdelt"],[]],
 [/face pull|rear delt|reverse fly/,["rdelt"],["trap"]],
 [/shrug/,["trap"],[]],
 [/straight-?arm/,["lat"],[]],
 [/pulldown|pull-?up|chin/,["lat"],["bicep"]],
 [/row/,["lat","trap"],["bicep","rdelt"]],
 [/shoulder press|overhead press|arnold|military/,["fdelt","sdelt"],["tricep"]],
 [/incline.*(press|push)/,["chest"],["fdelt","tricep"]],
 [/press|push-?up|dip/,["chest"],["tricep","fdelt"]],
 [/fly|pec deck/,["chest"],[]],
 [/hammer curl/,["bicep","fore"],[]],
 [/curl/,["bicep"],["fore"]],
 [/pushdown|extension|skull|kickback/,["tricep"],[]]
];
function muscleFor(name){
  const n=name.toLowerCase();
  for(const[rx,p,sec]of MRULES)if(rx.test(n))return{p,s:sec};
  return{p:[],s:[]};
}
function setVol(t){const w=+t.w||0,r=+t.r||0;return w>0?w*r:r*5;}
function entriesMuscleVol(entries){
  const mv={};
  for(const exName in entries){
    const m=muscleFor(exName);
    const vol=(entries[exName]||[]).reduce((a,t)=>a+setVol(t),0);
    if(!vol)continue;
    m.p.forEach(k=>mv[k]=(mv[k]||0)+vol/m.p.length);
    m.s.forEach(k=>mv[k]=(mv[k]||0)+vol*0.5/m.s.length);
  }
  return mv;
}
function lifetimeMuscleVol(exceptKey){
  const tot={};
  for(const k in S.workLog){
    if(k===exceptKey)continue;
    const mv=entriesMuscleVol(S.workLog[k].entries||{});
    for(const m in mv)tot[m]=(tot[m]||0)+mv[m];
  }
  return tot;
}
const RANKS=[["S",300000],["A",150000],["B",75000],["C",30000],["D",10000],["E",0]];
function rankOf(vol){for(const[r,t]of RANKS)if(vol>=t)return r;return"E";}
function xpBreakdown(){
  let vol=0,workouts=0,habits=0,foodDays=0,proteinHits=0,kcalHits=0;
  for(const k in S.workLog){const e=S.workLog[k];if(!e||!e.entries)continue;
    for(const x in e.entries)vol+=e.entries[x].reduce((a,t)=>a+setVol(t),0);
    if(e.done)workouts++;}
  for(const k in S.habits){const hh=S.habits[k];
    for(const hk in hh){if(hk==="water"){if(hh[hk]>=8)habits++;}else if(hh[hk])habits++;}}
  const T=targets();
  for(const k in S.foodLog){const items=S.foodLog[k];if(!items||!items.length)continue;
    foodDays++;const t=dayTotals(items);
    if(t.p>=T.p)proteinHits++;
    if(t.k>=T.kcal*0.9&&t.k<=T.kcal*1.1)kcalHits++;}
  const weighIns=S.weightLog.length;
  return {vol,workouts,habits,foodDays,proteinHits,kcalHits,weighIns,
    xp:Math.floor(vol/100)+workouts*25+habits*5+foodDays*10+proteinHits*15+kcalHits*15+weighIns*5};
}
function totalXP(){return xpBreakdown().xp;}
function levelInfo(){
  const xp=totalXP();let L=1;
  while(60*L*L<=xp)L++;
  return{L,xp,cur:60*(L-1)*(L-1),next:60*L*L};
}
function updateLv(){
  const b=el("lvBadge");if(b)b.textContent="LV "+levelInfo().L;
  try{checkAchievements();}catch(_){}
}
function mchipsHTML(exName){
  const m=muscleFor(exName);

  return `<div class="mchips">${m.p.map(k=>`<span class="mc mcp">${MUSCLES[k]}</span>`).join("")}${m.s.map(k=>`<span class="mc">${MUSCLES[k]}</span>`).join("")}</div>`;
}

/* ================= GUIDED SESSION MODE ================= */
let sess=null;
function startSession(){
  const day=S.plan.find(d=>d.id===gymDayId);
  if(!day||!day.ex.length){toast("This day has no exercises");return;}
  sess={dayId:day.id,exIdx:0,setIdx:0,start:Date.now()};
  renderGym();window.scrollTo(0,0);
}
function sessEntries(){
  const k=keyOf(viewDate);
  if(!S.workLog[k])S.workLog[k]={dayId:sess.dayId,entries:{},done:false};
  S.workLog[k].dayId=sess.dayId;
  return S.workLog[k].entries;
}
function renderSession(){
  const wasFlash=sess._flash;sess._flash=wasFlash; setTimeout(()=>{sess._flash=false;},50);
  const day=S.plan.find(d=>d.id===sess.dayId);
  const ex=day.ex[sess.exIdx];
  const e=sessEntries();
  if(!e[ex.n])e[ex.n]=[];
  const sug=coachSuggest(ex);
  const last=lastSession(ex.n,keyOf(viewDate));
  const prevSet=e[ex.n][sess.setIdx-1];

/* ================= GOALS ================= */
function goalInfo(){
  const g=S.goal;if(!g||!g.tw)return null;
  const wl=S.weightLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const cur=wl.length?wl[wl.length-1].kg:S.profile.w;
  const total=g.tw-g.sw,done=cur-g.sw;
  const pct=total?Math.max(0,Math.min(100,Math.round(done/total*100))):0;
  let trend=null;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-21);
  const recent=wl.filter(x=>x.date>=keyOf(cutoff));
  if(recent.length>=2){
    const days=(new Date(recent[recent.length-1].date)-new Date(recent[0].date))/864e5;
    if(days>=5)trend=(recent[recent.length-1].kg-recent[0].kg)/days*7;
  }
  let need=null;
  if(g.td){const weeks=Math.max(.5,(new Date(g.td)-Date.now())/6048e5);need=(g.tw-cur)/weeks;}
  return{g,cur,pct,trend,need};
}
function goalAdvice(gi){
  const T=targets(),bmrFloor=Math.max(1400,Math.round(calcTargets().bmr*1.05));
  if(gi.trend==null)return{msg:"Log weight 2–3× a week for ~2 weeks and the System will start steering you.",apply:null};
  const t=r1(gi.trend);
  if(gi.trend<-1)return{msg:`Losing ${Math.abs(t)} kg/week — faster than ideal for keeping muscle. Consider eating a bit more and keeping protein high.`,apply:Math.min(T.kcal+200,Math.round(calcTargets().tdee))};
  if(gi.need==null){
    if(Math.abs(gi.trend)<0.05)return{msg:`Weight is flat (${t>=0?"+":""}${t} kg/wk). If the mirror and waist are improving, that's recomp working.`,apply:null};
    const togo=gi.g.tw-gi.cur;
    if(togo*gi.trend>0){const wks=Math.ceil(Math.abs(togo/gi.trend));const eta=new Date();eta.setDate(eta.getDate()+wks*7);
      return{msg:`Trending ${t>0?"+":""}${t} kg/wk — ETA ~${eta.toLocaleDateString("en-IN",{day:"numeric",month:"short"})} at this pace.`,apply:null};}
    return{msg:`Trending ${t>0?"+":""}${t} kg/wk — the wrong direction for ${gi.g.tw} kg. Tighten intake ~200 kcal/day and recheck in 2 weeks.`,apply:Math.max(bmrFloor,T.kcal-200)};
  }
  const gap=gi.need-gi.trend;
  if(Math.abs(gap)<=0.12)return{msg:`On pace — needed ${r1(gi.need)} kg/wk, trending ${t>0?"+":""}${t}. Hold steady.`,apply:null};
  const adj=Math.max(-300,Math.min(300,Math.round(gap*7700/7/50)*50));
  const sugg=Math.max(bmrFloor,Math.min(Math.round(calcTargets().tdee*1.15),T.kcal+adj));
  return{msg:`Needed ${r1(gi.need)} kg/wk, trending ${t>0?"+":""}${t} — adjust ~${adj>0?"+":""}${adj} kcal/day to close the gap.`,apply:sugg!==T.kcal?sugg:null};
}

/* ================= PROGRESSION, REPORTS, PHOTOS, ACHIEVEMENTS ================= */
function e1rm(w,r){return (+w||0)*(1+(+r||0)/30);}
function exHistory(exName){
  return Object.keys(S.workLog).sort().map(k=>{
    const w=S.workLog[k];if(!w||!w.entries||!w.entries[exName])return null;
    const sets=w.entries[exName].filter(t=>t.w!=null&&t.r!=null&&(+t.w)>0);
    if(!sets.length)return null;
    return{date:k,topW:Math.max(...sets.map(t=>+t.w)),e1:Math.max(...sets.map(t=>e1rm(t.w,t.r)))};
  }).filter(Boolean);
}
function bestE1Before(exName,dayKey){
  let best=0;
  for(const k in S.workLog){
    if(k>=dayKey)continue;
    const w=S.workLog[k];if(!w||!w.entries||!w.entries[exName])continue;
    w.entries[exName].forEach(t=>{if(t.w!=null&&t.r!=null)best=Math.max(best,e1rm(t.w,t.r));});
  }
  return best;
}
const prToday={};
function checkPR(exName,w,r){
  if(!(+w>0)||!(+r>0))return;
  const e1=e1rm(w,r);
  const best=Math.max(bestE1Before(exName,keyOf(viewDate)),prToday[exName]||0);
  if(best>0&&e1>best+0.01){
    prToday[exName]=e1;
    announce("NEW RECORD",exName+" — "+w+" kg × "+r);
  }else if(e1>(prToday[exName]||0))prToday[exName]=e1;
}
function lineChart(pts,unit){
  if(pts.length<2)return `<div class="empty">Log this at least twice to see a trend.</div>`;
  const w=340,h=140,pl=34,pr=8,pt=10,pb=20;
  const ys=pts.map(p=>p.y);const min=Math.min(...ys),max=Math.max(...ys),rg=(max-min)||1;
  const X=i=>pl+i*(w-pl-pr)/(pts.length-1),Y=v=>pt+(1-(v-min)/rg)*(h-pt-pb);
  const path=pts.map((p,i)=>(i?"L":"M")+r1(X(i))+","+r1(Y(p.y))).join(" ");
  const area=path+` L${r1(X(pts.length-1))},${h-pb} L${pl},${h-pb} Z`;
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="cg${min}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(180,154,252,.32)"/><stop offset="100%" stop-color="rgba(180,154,252,0)"/></linearGradient></defs>
    ${[0,.5,1].map(f=>`<line x1="${pl}" x2="${w-pr}" y1="${r1(pt+f*(h-pt-pb))}" y2="${r1(pt+f*(h-pt-pb))}" stroke="rgba(180,154,252,.12)"/>`).join("")}
    <path d="${area}" fill="url(#cg${min})"/>
    <path d="${path}" fill="none" stroke="#B49AFC" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(180,154,252,.65))"/>
    <circle cx="${r1(X(pts.length-1))}" cy="${r1(Y(pts[pts.length-1].y))}" r="4" fill="#B49AFC"/>
    <text x="4" y="${pt+5}" fill="#645E78" font-size="10">${r1(max)}${unit}</text>
    <text x="4" y="${h-pb}" fill="#645E78" font-size="10">${r1(min)}${unit}</text>
  </svg>`;
}
function openExChart(exName){
  const hst=exHistory(exName);
  openSheet(`<h2>${esc(exName)}</h2>
    <div class="scroll chartcard">
    <h3 style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 0 4px">Top-set weight</h3>

    ${hst.length?`<div class="note" style="margin-top:10px">Best est. 1RM: <b style="color:var(--gold)">${Math.round(Math.max(...hst.map(p=>p.e1)))} kg</b> · ${hst.length} sessions · first ${hst[0].date.slice(5)}, latest ${hst[hst.length-1].date.slice(5)}</div>`:""}
    </div>`);
}
/* weekly system report */
function weekKeys(off){
  const keys=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i-off*7);keys.push(keyOf(d));}
  return keys;
}
function weekStats(keys){
  let vol=0,workouts=0,protHits=0,foodDays=0,kcalSum=0;
  const T=targets();
  keys.forEach(k=>{
    const w=S.workLog[k];
    if(w&&w.entries){for(const x in w.entries)vol+=w.entries[x].reduce((a,t)=>a+setVol(t),0);if(w.done)workouts++;}
    const items=S.foodLog[k];
    if(items&&items.length){foodDays++;const t=dayTotals(items);kcalSum+=t.k;if(t.p>=T.p)protHits++;}
  });
  return{vol,workouts,protHits,foodDays,avgK:foodDays?Math.round(kcalSum/foodDays):0};
}
function trendArrow(now,prev,goodUp){
  if(prev===0&&now===0)return"";
  const up=now>prev;
  const good=(up&&goodUp)||(!up&&!goodUp);
  return ` <span style="color:${good?"var(--ok)":"var(--warn)"};font-size:12px">${up?"▲":"▼"}</span>`;
}

  const mk=Object.keys(mv).sort((a,b)=>mv[b]-mv[a]);

  ${mk.length?`<h3 style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:6px 0">Muscle volume — this week</h3>`:`<div class="empty">No workouts logged this week yet.</div>`}
  ${mk.map(m=>`<div class="micro" style="margin-bottom:8px">

  <button class="btn" id="wrOk" style="margin-top:8px">Done</button>`);
  el("wrOk").onclick=closeSheet;

/* weight vs intake overlay (last 30 days) */
function dualChart(){

    return pts.map((p,j)=>(j?"L":"M")+r1(X(p.i))+","+r1(pt+(1-(p.y-mn)/rg)*(h-pt-pb))).join(" ");};
  return `<svg viewBox="0 0 ${w} ${h}">

/* progress photos via IndexedDB (too big for localStorage) */
const idb={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{
    const q=indexedDB.open("suyufit",1);
    q.onupgradeneeded=()=>q.result.createObjectStore("photos",{keyPath:"id"});
    q.onsuccess=()=>{this.db=q.result;res(this.db);};
    q.onerror=()=>rej(q.error);});},
  put(rec){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("photos","readwrite");t.objectStore("photos").put(rec);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));},
  all(){return this.open().then(db=>new Promise((res,rej)=>{
    const q=db.transaction("photos").objectStore("photos").getAll();
    q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);}));},
  del(id){return this.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("photos","readwrite");t.objectStore("photos").delete(id);
    t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
};
async function addProgressPhoto(file){

/* achievements */
function proteinStreak(){
  const T=targets();let streak=0;
  const hitOn=d=>{const it=S.foodLog[keyOf(d)];return it&&it.length&&dayTotals(it).p>=T.p;};
  const today=new Date();
  if(hitOn(today))streak++;
  for(let i=1;;i++){const d=new Date();d.setDate(d.getDate()-i);
    if(hitOn(d))streak++;else break;}
  return streak;
}
function achievements(){
  const bd=xpBreakdown(),lv=levelInfo(),ps=proteinStreak();
  return[
    {id:"t10",n:"First 10 Tonnes",d:"10 t lifetime volume",got:bd.vol>=10000},
    {id:"t50",n:"Heavy Machinery",d:"50 t lifetime volume",got:bd.vol>=50000},
    {id:"t100",n:"Six Figures",d:"100 t lifetime volume",got:bd.vol>=100000},
    {id:"w1",n:"First Session",d:"Complete a workout",got:bd.workouts>=1},
    {id:"w10",n:"Regular",d:"10 workouts logged",got:bd.workouts>=10},
    {id:"w50",n:"Relentless",d:"50 workouts logged",got:bd.workouts>=50},
    {id:"w100",n:"Centurion",d:"100 workouts logged",got:bd.workouts>=100},
    {id:"p7",n:"Protein Week",d:"Hit protein 7 days straight",got:ps>=7},
    {id:"p30",n:"Protein Month",d:"Hit protein 30 days straight",got:ps>=30},
    {id:"l5",n:"Awakened",d:"Reach LV 5",got:lv.L>=5},
    {id:"l10",n:"Adept",d:"Reach LV 10",got:lv.L>=10},
    {id:"l20",n:"Elite",d:"Reach LV 20",got:lv.L>=20}
  ];
}
function msSummary(){
  const ms=S.measures.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!ms.length)return `<div class="empty">Waist tells the recomp truth the scale hides — log it weekly.</div>`;
  const last=ms[ms.length-1],prev=ms.length>1?ms[ms.length-2]:null;
  const row=(label,key)=>{
    if(last[key]==null)return"";
    const d=prev&&prev[key]!=null?r1(last[key]-prev[key]):null;
    return `<div class="sysrow"><span>${label}</span><b class="num">${last[key]} cm ${d!=null?`<span style="font-size:12px;color:${d<=0?"var(--ok)":"var(--mut)"}">(${d>0?"+":""}${d})</span>`:""}</b></div>`;
  };
  return row("Waist","waist")+row("Chest","chest")+row("Arm","arm")+
    `<div class="note" style="margin-top:6px">Last logged ${last.date}</div>`;
}
function openMeasureSheet(){
  const ms=S.measures.slice().sort((a,b)=>a.date<b.date?-1:1);
  const last=ms.length?ms[ms.length-1]:{};
  openSheet(`<h2>Log measurements</h2>
    <div class="frow">
      <div><label class="fl">Waist cm</label><input id="msW" type="number" inputmode="decimal" value="${last.waist||""}"></div>
      <div><label class="fl">Chest cm</label><input id="msC" type="number" inputmode="decimal" value="${last.chest||""}"></div>
      <div><label class="fl">Arm cm</label><input id="msA" type="number" inputmode="decimal" value="${last.arm||""}"></div>
    </div>
    <div class="note" style="margin:4px 0 10px">Measure relaxed, same time of day, same spots. Weekly is plenty.</div>
    <button class="btn" id="msGo">Save</button>`);

      waist:+el("msW").value||null,chest:+el("msC").value||null,arm:+el("msA").value||null};
    if(!rec.waist&&!rec.chest&&!rec.arm){toast("Enter at least one");return;}
    const ex=S.measures.find(m=>m.date===rec.date);

function checkAchievements(){
  const got=achievements().filter(a=>a.got);
  const fresh=got.filter(a=>S.seenAch.indexOf(a.id)<0);
  if(fresh.length){
    announce("ACHIEVEMENT UNLOCKED",fresh[0].n);
    got.forEach(a=>{if(S.seenAch.indexOf(a.id)<0)S.seenAch.push(a.id);});
    save();
  }
}

function sparkline(vals){
  if(vals.length<2)return "";
  const w=320,h=70,pad=6;
  const min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1),h-pad-((v-min)/range)*(h-2*pad)]);
  const path=pts.map((p,i)=>(i?"L":"M")+r1(p[0])+","+r1(p[1])).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="weight trend">
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${r1(last[0])}" cy="${r1(last[1])}" r="4" fill="var(--gold)"/>
    <text x="${pad}" y="12" fill="var(--dim)" font-size="10">${max} kg</text>
    <text x="${pad}" y="${h-2}" fill="var(--dim)" font-size="10">${min} kg</text></svg>`;
}

/* ---------- rest timer ---------- */
function fmtSec(t){const m=Math.floor(t/60),ss=t%60;return m?m+":"+String(ss).padStart(2,"0"):ss+"s";}
const restPill=document.createElement("button");
restPill.id="restpill";restPill.style.display="none";document.body.appendChild(restPill);
let restInt=null;
function stopRest(){if(restInt){clearInterval(restInt);restInt=null;}restPill.style.display="none";}
restPill.onclick=stopRest;
function beepVibe(){
  try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();
    const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;g.gain.value=.12;o.start();
    setTimeout(()=>{o.frequency.value=1175;},180);
    setTimeout(()=>{o.stop();ctx.close();},420);}catch(e){}
  if(navigator.vibrate)navigator.vibrate([220,120,220]);
}
function startRest(sec,label){
  stopRest();
  let t=sec;
  restPill.style.display="flex";
  const paint=()=>{restPill.innerHTML=`<b class="num">${fmtSec(t)}</b><span>rest · ${esc(label)}</span><i>✕</i>`;};
  paint();
  restInt=setInterval(()=>{
    t--;
    if(t<=0){clearInterval(restInt);restInt=null;beepVibe();
      restPill.innerHTML=`<b>Go!</b><span>next set — ${esc(label)}</span>`;
      restPill.classList.add("go");
      setTimeout(()=>{restPill.style.display="none";restPill.classList.remove("go");},3500);
    }else paint();
  },1000);
}

if(!S.onboarded)onboard();
renderAll();
